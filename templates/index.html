<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Product Description Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        .output {
            margin-top: 25px;
            padding: 20px;
            background-color: #eeeeee;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AI Product Description Generator</h1>

        <form method="POST">
            <label for="product_name">Product Name:</label>
            <input
                type="text"
                id="product_name"
                name="product_name"
                placeholder="Example: Wireless Bluetooth Headphones"
                required
            >

            <label for="keywords">Keywords (comma-separated):</label>
            <input
                type="text"
                id="keywords"
                name="keywords"
                placeholder="Example: comfortable, wireless, long battery life"
                required
            >

            <button type="submit">Generate Description</button>
        </form>

        {% if description %}
        <div class="output">
            <h2>Generated Description</h2>
            <p>{{ description }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
